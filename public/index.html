<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hummus Fit — Fleet Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  /* Same light palette as myhummusfit.com and the Route Board dispatch
     view — cream background, white cards, teal/orange brand accents on
     near-black text. This used to be a dark "ticket-rail" theme like the
     ops hub; moved to match the site look specifically, per request. */
  :root{
    --bg:#F7F6F3;
    --card:#FFFFFF;
    --ink:#141311;
    --dim:#7A776E;
    --line:rgba(20,19,17,0.09);
    --orange:#E8612C;
    --orange-tint:#FDEBE3;
    --teal:#1FA98F;
    --teal-tint:#E3F5F1;
    --shadow: 0 1px 2px rgba(20,19,17,0.04), 0 8px 24px rgba(20,19,17,0.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--ink); font-family:'Montserrat',sans-serif; height:100%;}
  body{
    background:
      radial-gradient(circle at 8% 0%, rgba(232,97,44,0.06), transparent 40%),
      radial-gradient(circle at 95% 10%, rgba(31,169,143,0.07), transparent 40%),
      var(--bg);
  }

  header{
    padding: 28px 6vw 20px;
    border-bottom: 2px solid var(--ink);
    background: var(--bg);
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--orange);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 10px;
  }
  .eyebrow::before{
    content:"";
    width:7px; height:7px;
    background: var(--teal);
    border-radius:50%;
    box-shadow: 0 0 8px var(--teal);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size: clamp(36px, 6vw, 64px);
    line-height: 0.9;
    letter-spacing: 0.01em;
    color: var(--ink);
  }
  h1 span{ color: var(--teal); }

  main{
    display:grid;
    grid-template-columns: 340px 1fr;
    height: calc(100vh - 110px);
  }
  @media (max-width: 800px){
    main{ grid-template-columns: 1fr; grid-template-rows: auto 50vh; height:auto; }
  }

  .vehicle-list{
    padding: 20px;
    overflow-y:auto;
    border-right: 1px solid var(--line);
    background: var(--bg);
  }
  .vehicle-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor:pointer;
    transition: border-color .15s ease, transform .15s ease;
  }
  .vehicle-card:hover{ border-color: var(--teal); transform: translateY(-1px); }
  .vehicle-card.selected{ border-color: var(--orange); box-shadow: 0 0 0 1.5px var(--orange), var(--shadow); }
  .vehicle-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 6px;
  }
  .vehicle-name{
    font-family:'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing:0.02em;
    color: var(--ink);
  }
  .vehicle-status{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .status-moving{ color: var(--teal); background: var(--teal-tint); }
  .status-idle{ color: var(--orange); background: var(--orange-tint); }
  .status-off{ color: var(--dim); background: var(--line); }
  .vehicle-detail{
    font-size: 12px;
    color: var(--dim);
    line-height:1.6;
  }
  .vehicle-detail b{ color: var(--ink); font-weight:600; }

  #map{
    background: var(--card);
  }

  .empty-state{
    padding: 40px 24px;
    text-align:center;
    color: var(--dim);
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    line-height:1.8;
  }
  .empty-state a{ color: var(--teal); }

  .refresh-note{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    padding: 10px 20px;
    border-top: 1px solid var(--line);
    background: var(--bg);
  }

  /* pulsing vehicle marker — white ring so it pops off the light basemap */
  .veh-marker{
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--teal);
    border: 2.5px solid #fff;
    box-shadow: 0 1px 4px rgba(20,19,17,0.35), 0 0 0 rgba(31,169,143,0.6);
    animation: markerPulse 2s infinite;
  }
  .veh-marker.idle{ background: var(--orange); animation: markerPulseOrange 2s infinite; }
  @keyframes markerPulse{
    0%{ box-shadow: 0 1px 4px rgba(20,19,17,0.35), 0 0 0 0 rgba(31,169,143,0.6); }
    70%{ box-shadow: 0 1px 4px rgba(20,19,17,0.35), 0 0 0 12px rgba(31,169,143,0); }
    100%{ box-shadow: 0 1px 4px rgba(20,19,17,0.35), 0 0 0 0 rgba(31,169,143,0); }
  }
  @keyframes markerPulseOrange{
    0%{ box-shadow: 0 1px 4px rgba(20,19,17,0.35), 0 0 0 0 rgba(232,97,44,0.6); }
    70%{ box-shadow: 0 1px 4px rgba(20,19,17,0.35), 0 0 0 12px rgba(232,97,44,0); }
    100%{ box-shadow: 0 1px 4px rgba(20,19,17,0.35), 0 0 0 0 rgba(232,97,44,0); }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Hummus Fit / Buffin Bakery</div>
  <h1>FLEET <span>TRACKER</span></h1>
</header>

<main>
  <div class="vehicle-list" id="vehicleList">
    <div class="empty-state">Loading vehicles…</div>
  </div>
  <div id="map"></div>
</main>
<div class="refresh-note" id="refreshNote">Refreshing every 15 seconds</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = L.map('map', { zoomControl: true }).setView([40.83, -73.13], 10);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 19
  }).addTo(map);

  var markers = {};
  var selectedImei = null;

  // Lets another app (the store-facing receiving-check page) deep-link
  // straight to the specific van heading their way, e.g. /?imei=352...
  // Matched by IMEI, not nickName — Bouncie's nickName field is
  // free-typed and doesn't reliably match what Route Board calls the
  // same van (typos, missing words), so the caller resolves the exact
  // vehicle server-side and hands us its IMEI directly. Only
  // auto-selects once, the first time vehicles load, so it doesn't fight
  // a person who's since clicked a different vehicle in the list.
  var requestedImei = null;
  try {
    requestedImei = new URLSearchParams(location.search).get('imei');
  } catch (e) { /* ancient browser — just skip deep-linking */ }
  var autoSelectDone = false;

  function statusFromVehicle(v){
    // Bouncie stats: moving speed > 0 = moving, ignition on/idle, else off
    var speed = (v.stats && v.stats.speed) || 0;
    var isRunning = v.stats && v.stats.isRunning;
    if(speed > 1) return 'moving';
    if(isRunning) return 'idle';
    return 'off';
  }

  function statusLabel(s){
    return s === 'moving' ? 'Moving' : s === 'idle' ? 'Idle' : 'Parked';
  }

  // A few vans (e.g. the 2016 Ford Transit, the 2022 RAM Promaster) never
  // got a nickName set in Bouncie. v.model is an object ({make, name,
  // year}), not a string — falling straight through to it, as the old
  // code did, rendered the literal text "[object Object]" in the list.
  // Build a real label from the model fields instead.
  function vehicleLabel(v){
    if(v.nickName && v.nickName.trim()) return v.nickName.trim();
    if(v.model){
      var parts = [v.model.year, v.model.make, v.model.name].filter(Boolean);
      if(parts.length) return parts.join(' ');
    }
    return 'Vehicle';
  }

  function renderVehicles(vehicles){
    var list = document.getElementById('vehicleList');
    if(!vehicles || vehicles.length === 0){
      list.innerHTML = '<div class="empty-state">No vehicles returned yet.<br>Check that devices are authorized in your Bouncie developer account.</div>';
      return;
    }
    list.innerHTML = '';

    if(requestedImei && !autoSelectDone){
      var match = vehicles.find(function(v){
        return v.imei === requestedImei;
      });
      if(match){
        selectedImei = match.imei;
        autoSelectDone = true;
        var mLat = match.stats && match.stats.location && match.stats.location.lat;
        var mLon = match.stats && match.stats.location && match.stats.location.lon;
        if(mLat && mLon){ map.setView([mLat, mLon], 15); }
      }
    }

    vehicles.forEach(function(v){
      var status = statusFromVehicle(v);
      var lat = v.stats && v.stats.location && v.stats.location.lat;
      var lon = v.stats && v.stats.location && v.stats.location.lon;
      var speed = (v.stats && v.stats.speed) || 0;
      var fuel = v.stats && v.stats.fuelLevel;
      var address = (v.stats && v.stats.location && v.stats.location.address) || 'Unknown location';

      var card = document.createElement('div');
      card.className = 'vehicle-card' + (v.imei === selectedImei ? ' selected' : '');
      card.innerHTML =
        '<div class="vehicle-top">' +
          '<span class="vehicle-name">' + vehicleLabel(v) + '</span>' +
          '<span class="vehicle-status status-' + status + '">' + statusLabel(status) + '</span>' +
        '</div>' +
        '<div class="vehicle-detail">' +
          (speed > 1 ? '<b>' + Math.round(speed) + ' mph</b> &middot; ' : '') +
          (fuel != null ? '<b>' + Math.round(fuel) + '%</b> fuel &middot; ' : '') +
          address +
        '</div>';
      card.addEventListener('click', function(){
        selectedImei = v.imei;
        renderVehicles(vehicles);
        if(lat && lon){ map.setView([lat, lon], 15); }
      });
      list.appendChild(card);

      if(lat && lon){
        var icon = L.divIcon({
          className: '',
          html: '<div class="veh-marker' + (status === 'idle' ? ' idle' : '') + '"></div>',
          iconSize: [16, 16]
        });
        if(markers[v.imei]){
          markers[v.imei].setLatLng([lat, lon]);
          markers[v.imei].setIcon(icon);
        } else {
          markers[v.imei] = L.marker([lat, lon], { icon: icon }).addTo(map)
            .bindPopup(vehicleLabel(v));
        }
      }
    });
  }

  function fetchVehicles(){
    fetch('/api/vehicles')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.error){
          document.getElementById('vehicleList').innerHTML =
            '<div class="empty-state">Couldn\'t load vehicles.<br><b>' + data.error + '</b><br><br>' +
            'Check the BOUNCIE_CLIENT_ID / SECRET / AUTH_CODE environment variables on Railway.</div>';
          return;
        }
        renderVehicles(data);
      })
      .catch(function(){
        document.getElementById('vehicleList').innerHTML =
          '<div class="empty-state">Couldn\'t reach the tracker service.</div>';
      });
  }

  fetchVehicles();
  setInterval(fetchVehicles, 15000);
</script>

</body>
</html>
