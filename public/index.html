<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hummus Fit — Fleet Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  /* Same light palette as myhummusfit.com and the Route Board dispatch
     view — cream background, white cards, teal/orange brand accents on
     near-black text. This used to be a dark "ticket-rail" theme like the
     ops hub; moved to match the site look specifically, per request. */
  :root{
    --bg:#F7F6F3;
    --card:#FFFFFF;
    --ink:#141311;
    --dim:#7A776E;
    --line:rgba(20,19,17,0.09);
    --orange:#E8612C;
    --orange-tint:#FDEBE3;
    --teal:#1FA98F;
    --teal-tint:#E3F5F1;
    --shadow: 0 1px 2px rgba(20,19,17,0.04), 0 8px 24px rgba(20,19,17,0.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--ink); font-family:'Montserrat',sans-serif; height:100%;}
  body{
    background:
      radial-gradient(circle at 8% 0%, rgba(232,97,44,0.06), transparent 40%),
      radial-gradient(circle at 95% 10%, rgba(31,169,143,0.07), transparent 40%),
      var(--bg);
  }

  header{
    padding: 28px 6vw 20px;
    border-bottom: 2px solid var(--ink);
    background: var(--bg);
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--orange);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 10px;
  }
  .eyebrow::before{
    content:"";
    width:7px; height:7px;
    background: var(--teal);
    border-radius:50%;
    box-shadow: 0 0 8px var(--teal);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size: clamp(36px, 6vw, 64px);
    line-height: 0.9;
    letter-spacing: 0.01em;
    color: var(--ink);
  }
  h1 span{ color: var(--teal); }

  main{
    position:relative;
    display:grid;
    grid-template-columns: 340px 1fr;
    height: calc(100vh - 110px);
  }
  @media (max-width: 800px){
    main{ grid-template-columns: 1fr; grid-template-rows: auto 50vh; height:auto; }
    .trip-panel{position:fixed;max-height:62vh;bottom:12px;right:12px;width:calc(100% - 24px);}
  }

  .vehicle-list{
    padding: 20px;
    overflow-y:auto;
    border-right: 1px solid var(--line);
    background: var(--bg);
  }
  .vehicle-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor:pointer;
    transition: border-color .15s ease, transform .15s ease;
  }
  .vehicle-card:hover{ border-color: var(--teal); transform: translateY(-1px); }
  .vehicle-card.selected{ border-color: var(--orange); box-shadow: 0 0 0 1.5px var(--orange), var(--shadow); }
  .vehicle-art{height:112px;display:grid;place-items:center;margin:-5px -6px 10px;border-radius:11px;background:radial-gradient(circle at 50% 28%,#fff 0,#edf6f3 66%,#f8faf8 100%);overflow:hidden;}
  .vehicle-art img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 9px 7px rgba(20,54,49,.2));}
  .vehicle-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 6px;
  }
  .vehicle-name{
    font-family:'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing:0.02em;
    color: var(--ink);
  }
  .vehicle-status{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .status-moving{ color: var(--teal); background: var(--teal-tint); }
  .status-idle{ color: var(--orange); background: var(--orange-tint); }
  .status-off{ color: var(--dim); background: var(--line); }
  .vehicle-detail{
    font-size: 12px;
    color: var(--dim);
    line-height:1.6;
  }
  .vehicle-detail b{ color: var(--ink); font-weight:600; }
  .vehicle-live-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .vehicle-live-grid span{padding:7px 8px;border-radius:8px;background:var(--bg);color:var(--dim);font-size:9px;line-height:1.35;}
  .vehicle-live-grid b{display:block;margin-top:2px;color:var(--ink);font-size:11px;}
  .health-warning{color:#a33!important;background:#fff0ed!important;}
  .trip-open{width:100%;margin-top:10px;padding:8px;border:0;border-radius:8px;background:var(--teal-tint);color:#087666;font-size:10px;font-weight:800;cursor:pointer;}

  #map{
    background: var(--card);
  }

  .empty-state{
    padding: 40px 24px;
    text-align:center;
    color: var(--dim);
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    line-height:1.8;
  }
  .empty-state a{ color: var(--teal); }

  .refresh-note{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    padding: 10px 20px;
    border-top: 1px solid var(--line);
    background: var(--bg);
  }
  .trip-panel{position:absolute;z-index:900;right:18px;bottom:18px;width:min(410px,calc(100% - 36px));max-height:72%;overflow:auto;padding:18px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 55px rgba(20,19,17,.2);transform:translateY(calc(100% + 40px));opacity:0;pointer-events:none;transition:.2s ease;}
  .trip-panel.open{transform:none;opacity:1;pointer-events:auto;}
  .trip-panel-head{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .trip-panel h2{font:24px 'Bebas Neue',sans-serif;letter-spacing:.02em;}
  .trip-panel-head button{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;}
  .trip-subtitle{color:var(--dim);font-size:10px;line-height:1.5;}
  .trip-list{display:grid;gap:8px;margin-top:12px;}
  .trip-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;text-align:left;}
  .trip-row:hover{border-color:var(--teal);}
  .trip-row b,.trip-row small{display:block}.trip-row b{font-size:11px}.trip-row small{margin-top:4px;color:var(--dim);font-size:9px;line-height:1.45}.trip-row strong{color:var(--teal);font-size:12px;}
  .trip-alert{color:#a33!important;}
  @media (max-width: 800px){
    .trip-panel{position:fixed;max-height:62vh;bottom:12px;right:12px;width:calc(100% - 24px);}
  }

  /* pulsing vehicle marker — white ring so it pops off the light basemap */
  .veh-marker{
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--teal);
    border: 2.5px solid #fff;
    box-shadow: 0 1px 4px rgba(20,19,17,0.35), 0 0 0 rgba(31,169,143,0.6);
    animation: markerPulse 2s infinite;
  }
  .veh-marker.idle{ background: var(--orange); animation: markerPulseOrange 2s infinite; }
  .veh-photo-marker{width:74px;height:54px;display:grid;place-items:center;border-radius:15px;background:rgba(255,255,255,.94);border:2px solid #fff;box-shadow:0 6px 18px rgba(20,49,45,.28),0 0 0 2px var(--teal);transform-origin:center bottom;}
  .veh-photo-marker.idle{box-shadow:0 6px 18px rgba(20,49,45,.28),0 0 0 2px var(--orange);}
  .veh-photo-marker img{width:88px;height:66px;object-fit:contain;filter:drop-shadow(0 5px 4px rgba(20,49,45,.25));}
  @keyframes markerPulse{
    0%{ box-shadow: 0 1px 4px rgba(20,19,17,0.35), 0 0 0 0 rgba(31,169,143,0.6); }
    70%{ box-shadow: 0 1px 4px rgba(20,19,17,0.35), 0 0 0 12px rgba(31,169,143,0); }
    100%{ box-shadow: 0 1px 4px rgba(20,19,17,0.35), 0 0 0 0 rgba(31,169,143,0); }
  }
  @keyframes markerPulseOrange{
    0%{ box-shadow: 0 1px 4px rgba(20,19,17,0.35), 0 0 0 0 rgba(232,97,44,0.6); }
    70%{ box-shadow: 0 1px 4px rgba(20,19,17,0.35), 0 0 0 12px rgba(232,97,44,0); }
    100%{ box-shadow: 0 1px 4px rgba(20,19,17,0.35), 0 0 0 0 rgba(232,97,44,0); }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Manager console / Bouncie live</div>
  <h1>FLEET <span>TRACKER</span></h1>
</header>

<main>
  <div class="vehicle-list" id="vehicleList">
    <div class="empty-state">Loading vehicles…</div>
  </div>
  <div id="map"></div>
  <aside class="trip-panel" id="tripPanel" aria-live="polite" aria-label="Vehicle trip history">
    <div class="trip-panel-head">
      <div>
        <div class="eyebrow">Bouncie trip history</div>
        <h2 id="tripTitle">Vehicle trips</h2>
      </div>
      <button type="button" id="closeTrips" aria-label="Close trip history">&#10005;</button>
    </div>
    <p class="trip-subtitle" id="tripSubtitle">Select a vehicle to view its latest trips and draw a route on the map.</p>
    <div class="trip-list" id="tripList"></div>
  </aside>
</main>
<div class="refresh-note" id="refreshNote">Refreshing every 15 seconds</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = L.map('map', { zoomControl: true }).setView([40.83, -73.13], 10);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 19
  }).addTo(map);

  var markers = {};
  var selectedImei = null;
  var currentVehicles = [];
  var tripRoute = null;

  // Lets another app (the store-facing receiving-check page) deep-link
  // straight to the specific van heading their way, e.g. /?imei=352...
  // Matched by IMEI, not nickName — Bouncie's nickName field is
  // free-typed and doesn't reliably match what Route Board calls the
  // same van (typos, missing words), so the caller resolves the exact
  // vehicle server-side and hands us its IMEI directly. Only
  // auto-selects once, the first time vehicles load, so it doesn't fight
  // a person who's since clicked a different vehicle in the list.
  var requestedImei = null;
  try {
    requestedImei = new URLSearchParams(location.search).get('imei');
  } catch (e) { /* ancient browser — just skip deep-linking */ }
  var autoSelectDone = false;

  function statusFromVehicle(v){
    // Bouncie stats: moving speed > 0 = moving, ignition on/idle, else off
    var speed = (v.stats && v.stats.speed) || 0;
    var isRunning = v.stats && v.stats.isRunning;
    if(speed > 1) return 'moving';
    if(isRunning) return 'idle';
    return 'off';
  }

  function statusLabel(s){
    return s === 'moving' ? 'Moving' : s === 'idle' ? 'Idle' : 'Parked';
  }

  // A few vans (e.g. the 2016 Ford Transit, the 2022 RAM Promaster) never
  // got a nickName set in Bouncie. v.model is an object ({make, name,
  // year}), not a string — falling straight through to it, as the old
  // code did, rendered the literal text "[object Object]" in the list.
  // Build a real label from the model fields instead.
  function vehicleLabel(v){
    if(v.nickName && v.nickName.trim()) return v.nickName.trim();
    if(v.model){
      var parts = [v.model.year, v.model.make, v.model.name].filter(Boolean);
      if(parts.length) return parts.join(' ');
    }
    return 'Vehicle';
  }

  function escapeHtml(value){
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(character){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character];
    });
  }

  function formatNumber(value, digits){
    var number = Number(value);
    return Number.isFinite(number) ? number.toFixed(digits == null ? 0 : digits) : '—';
  }

  function formatDate(value){
    if(!value) return 'Unknown time';
    var date = new Date(value);
    return Number.isNaN(date.getTime()) ? 'Unknown time' : date.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  }

  function relativeUpdate(value){
    if(!value) return {label:'Unknown', stale:true};
    var elapsed = Date.now() - new Date(value).getTime();
    if(!Number.isFinite(elapsed)) return {label:'Unknown', stale:true};
    var minutes = Math.max(0, Math.round(elapsed / 60000));
    if(minutes < 2) return {label:'Just now', stale:false};
    if(minutes < 60) return {label:minutes + ' min ago', stale:minutes > 30};
    var hours = Math.round(minutes / 60);
    if(hours < 48) return {label:hours + ' hr ago', stale:true};
    return {label:Math.round(hours / 24) + ' days ago', stale:true};
  }

  var vehicleArtwork = {
    '#1 mercedes blue': '/vehicles/mercedes-blue-1.png',
    '#2 mercedes small': '/vehicles/mercedes-small-2.png',
    '#3 mercedes small2': '/vehicles/mercedes-small2-3.png',
    '#4 mercedes orange': '/vehicles/mercedes-orange-4.png',
    '#5 white ford transit': '/vehicles/white-ford-transit-5.png',
    '#6 black ford': '/vehicles/black-ford-6.png',
    '#7 white mercedes': '/vehicles/white-mercedes-7.png',
    '#8 2016 ford transit': '/vehicles/ford-transit-2016-8.png',
    '#9 transit 350 - (1)': '/vehicles/transit-350-9.png',
    'ram': '/vehicles/dodge-ram.png'
  };

  function normalizeVehicleName(value){
    return String(value || '').normalize('NFKC').replace(/\s+/g, ' ').trim().toLowerCase();
  }

  function vehicleArtworkFor(v){
    return vehicleArtwork[normalizeVehicleName(vehicleLabel(v))] || null;
  }

  function renderVehicles(vehicles){
    currentVehicles = vehicles || [];
    var list = document.getElementById('vehicleList');
    if(!vehicles || vehicles.length === 0){
      list.innerHTML = '<div class="empty-state">No vehicles returned yet.<br>Check that devices are authorized in your Bouncie developer account.</div>';
      return;
    }
    list.innerHTML = '';

    if(requestedImei && !autoSelectDone){
      var match = vehicles.find(function(v){
        return v.imei === requestedImei;
      });
      if(match){
        selectedImei = match.imei;
        autoSelectDone = true;
        var mLat = match.stats && match.stats.location && match.stats.location.lat;
        var mLon = match.stats && match.stats.location && match.stats.location.lon;
        if(mLat && mLon){ map.setView([mLat, mLon], 15); }
      }
    }

    vehicles.forEach(function(v){
      var status = statusFromVehicle(v);
      var lat = v.stats && v.stats.location && v.stats.location.lat;
      var lon = v.stats && v.stats.location && v.stats.location.lon;
      var speed = (v.stats && v.stats.speed) || 0;
      var fuel = v.stats && v.stats.fuelLevel;
      var address = (v.stats && v.stats.location && v.stats.location.address) || 'Unknown location';
      var artwork = vehicleArtworkFor(v);
      var odometer = v.stats && v.stats.odometer;
      var battery = v.stats && v.stats.battery;
      var mil = v.stats && v.stats.mil;
      var update = relativeUpdate(v.stats && v.stats.lastUpdated);
      var batteryLabel = battery && battery.status ? battery.status : 'No alert';
      var engineLabel = mil && mil.milOn ? 'Check engine' : 'No alert';
      var safeName = escapeHtml(vehicleLabel(v));

      var card = document.createElement('div');
      card.className = 'vehicle-card' + (v.imei === selectedImei ? ' selected' : '');
      card.innerHTML =
        (artwork ? '<div class="vehicle-art"><img src="' + artwork + '" alt="' + safeName + ' vehicle"></div>' : '') +
        '<div class="vehicle-top">' +
          '<span class="vehicle-name">' + safeName + '</span>' +
          '<span class="vehicle-status status-' + status + '">' + statusLabel(status) + '</span>' +
        '</div>' +
        '<div class="vehicle-detail">' +
          (speed > 1 ? '<b>' + Math.round(speed) + ' mph</b> &middot; ' : '') +
          (fuel != null ? '<b>' + Math.round(fuel) + '%</b> fuel &middot; ' : '') +
          escapeHtml(address) +
        '</div>' +
        '<div class="vehicle-live-grid">' +
          '<span>ODOMETER<b>' + (odometer != null ? formatNumber(odometer, 1) + ' mi' : '—') + '</b></span>' +
          '<span class="' + (update.stale ? 'health-warning' : '') + '">LAST SIGNAL<b>' + escapeHtml(update.label) + '</b></span>' +
          '<span class="' + (battery && battery.status && String(battery.status).toLowerCase() !== 'normal' ? 'health-warning' : '') + '">BATTERY<b>' + escapeHtml(batteryLabel) + '</b></span>' +
          '<span class="' + (mil && mil.milOn ? 'health-warning' : '') + '">ENGINE<b>' + escapeHtml(engineLabel) + '</b></span>' +
        '</div>' +
        '<button type="button" class="trip-open">VIEW LAST 20 TRIPS</button>';
      card.addEventListener('click', function(){
        selectedImei = v.imei;
        renderVehicles(currentVehicles);
        if(lat && lon){ map.setView([lat, lon], 15); }
      });
      card.querySelector('.trip-open').addEventListener('click', function(event){
        event.stopPropagation();
        selectedImei = v.imei;
        renderVehicles(currentVehicles);
        if(lat && lon){ map.setView([lat, lon], 15); }
        loadTrips(v);
      });
      list.appendChild(card);

      if(lat && lon){
        var icon = artwork ? L.divIcon({
          className: '',
          html: '<div class="veh-photo-marker' + (status === 'idle' ? ' idle' : '') + '"><img src="' + artwork + '" alt=""></div>',
          iconSize: [74, 54], iconAnchor: [37, 48], popupAnchor: [0, -48]
        }) : L.divIcon({
          className: '',
          html: '<div class="veh-marker' + (status === 'idle' ? ' idle' : '') + '"></div>',
          iconSize: [16, 16]
        });
        if(markers[v.imei]){
          markers[v.imei].setLatLng([lat, lon]);
          markers[v.imei].setIcon(icon);
        } else {
          markers[v.imei] = L.marker([lat, lon], { icon: icon }).addTo(map)
            .bindPopup(vehicleLabel(v));
        }
      }
    });
  }

  function tripDuration(trip){
    var start = new Date(trip.startTime).getTime();
    var end = new Date(trip.endTime).getTime();
    if(!Number.isFinite(start) || !Number.isFinite(end)) return '—';
    var minutes = Math.max(0, Math.round((end - start) / 60000));
    return minutes < 60 ? minutes + ' min' : Math.floor(minutes / 60) + ' hr ' + (minutes % 60) + ' min';
  }

  function drawTrip(trip){
    var coordinates = trip.gps && trip.gps.coordinates;
    if(!Array.isArray(coordinates) || coordinates.length < 2){
      document.getElementById('tripSubtitle').textContent = 'A mapped GPS route is not available for this trip.';
      return;
    }
    var latLngs = coordinates.map(function(point){ return [point[1], point[0]]; });
    if(tripRoute) map.removeLayer(tripRoute);
    tripRoute = L.polyline(latLngs, {color:'#e8612c',weight:5,opacity:.88}).addTo(map);
    map.fitBounds(tripRoute.getBounds(), {padding:[40,40]});
    document.getElementById('tripSubtitle').textContent = 'Selected route is highlighted in orange on the map.';
  }

  function renderTrips(trips){
    var list = document.getElementById('tripList');
    if(!Array.isArray(trips) || trips.length === 0){
      list.innerHTML = '<div class="empty-state">No completed trips were returned for this vehicle.</div>';
      return;
    }
    list.innerHTML = '';
    trips.forEach(function(trip){
      var hardEvents = Number(trip.hardBrakingCount || 0) + Number(trip.hardAccelerationCount || 0);
      var idleMinutes = Math.round(Number(trip.totalIdleDuration || 0) / 60);
      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'trip-row';
      row.innerHTML = '<span><b>' + escapeHtml(formatDate(trip.startTime)) + '</b>' +
        '<small>' + escapeHtml(tripDuration(trip)) + ' · Avg ' + formatNumber(trip.averageSpeed, 0) + ' mph · Max ' + formatNumber(trip.maxSpeed, 0) + ' mph<br>' +
        idleMinutes + ' min idle · ' + formatNumber(trip.fuelConsumed, 2) + ' gal' +
        (hardEvents ? ' · <span class="trip-alert">' + hardEvents + ' hard-driving event' + (hardEvents === 1 ? '' : 's') + '</span>' : '') + '</small></span>' +
        '<strong>' + formatNumber(trip.distance, 1) + ' mi</strong>';
      row.addEventListener('click', function(){ drawTrip(trip); });
      list.appendChild(row);
    });
  }

  function loadTrips(vehicle){
    var panel = document.getElementById('tripPanel');
    document.getElementById('tripTitle').textContent = vehicleLabel(vehicle);
    document.getElementById('tripSubtitle').textContent = 'Loading the latest 20 completed trips…';
    document.getElementById('tripList').innerHTML = '';
    panel.classList.add('open');
    fetch('/api/vehicles/' + encodeURIComponent(vehicle.imei) + '/trips?limit=20')
      .then(function(response){
        if(response.status === 401){ location.assign('/sign-in?redirect_url=/'); throw new Error('Authentication required'); }
        return response.json();
      })
      .then(function(data){
        if(data.error) throw new Error(data.error);
        document.getElementById('tripSubtitle').textContent = 'Choose a trip to draw its recorded route on the map.';
        renderTrips(data);
      })
      .catch(function(error){
        if(error.message === 'Authentication required') return;
        document.getElementById('tripSubtitle').textContent = 'Trip history could not be loaded.';
        document.getElementById('tripList').innerHTML = '<div class="empty-state">' + escapeHtml(error.message) + '</div>';
      });
  }

  document.getElementById('closeTrips').addEventListener('click', function(){
    document.getElementById('tripPanel').classList.remove('open');
    if(tripRoute){ map.removeLayer(tripRoute); tripRoute = null; }
  });

  function fetchVehicles(){
    fetch('/api/vehicles')
      .then(function(r){
        if(r.status === 401){ location.assign('/sign-in?redirect_url=/'); throw new Error('Authentication required'); }
        return r.json();
      })
      .then(function(data){
        if(data.error){
          document.getElementById('vehicleList').innerHTML =
            '<div class="empty-state">Couldn\'t load vehicles.<br><b>' + data.error + '</b><br><br>' +
            'Check the BOUNCIE_CLIENT_ID / SECRET / AUTH_CODE environment variables on Railway.</div>';
          return;
        }
        renderVehicles(data);
      })
      .catch(function(error){
        if(error.message === 'Authentication required') return;
        document.getElementById('vehicleList').innerHTML =
          '<div class="empty-state">Couldn\'t reach the tracker service.</div>';
      });
  }

  fetchVehicles();
  setInterval(fetchVehicles, 15000);
</script>

</body>
</html>
